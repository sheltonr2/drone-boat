<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drone boat 3D viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1117; --panel:rgba(16,21,29,.86); --panel2:rgba(26,33,44,.92); --line:rgba(255,255,255,.09);
  --text:#e8edf3; --muted:#93a1b2; --accent:#ff6a1a; --accent2:#3fa7ff; --ok:#43c08a;
  --r:12px; --font:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:13px/1.45 var(--font);-webkit-font-smoothing:antialiased}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent2)}
.glass{background:var(--panel);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 40px rgba(0,0,0,.35)}

/* top bar */
#top{position:fixed;left:12px;right:12px;top:12px;display:flex;align-items:center;gap:12px;pointer-events:none;z-index:5}
#brand{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:8px 14px 8px 10px}
#brand .logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#ff8a3d,#ff5a14);display:grid;place-items:center;box-shadow:0 0 0 1px rgba(255,255,255,.15) inset}
#brand .logo svg{width:16px;height:16px}
#brand h1{font-size:14px;margin:0;font-weight:650;letter-spacing:.1px}
#brand small{display:block;color:var(--muted);font-size:11px;font-weight:450;margin-top:-1px}
#modes{pointer-events:auto;display:flex;padding:4px;gap:2px}
#modes button{border:0;background:transparent;padding:7px 14px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:550}
#modes button.on{background:rgba(255,255,255,.1);color:var(--text)}
#top .spacer{flex:1}
#hud{pointer-events:auto;padding:7px 12px;color:var(--muted);font-size:11.5px;font-family:var(--mono)}

/* side panel */
#side{position:fixed;left:12px;top:70px;bottom:12px;width:320px;display:flex;flex-direction:column;z-index:4;overflow:hidden}
#side .scroll{overflow:auto;flex:1;padding:6px 0 10px}
#side .scroll::-webkit-scrollbar{width:8px}#side .scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px}
.sec{padding:10px 14px;border-bottom:1px solid var(--line)}
.sec h3{margin:0 0 8px;font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);font-weight:600}
.row{display:flex;align-items:center;gap:8px;margin:6px 0}
.row label{flex:1;color:#cdd6e0}
.row output{font-family:var(--mono);font-size:11.5px;color:var(--muted);min-width:44px;text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;width:150px;height:4px;border-radius:4px;background:rgba(255,255,255,.14);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#fff;border:3px solid var(--accent);cursor:pointer}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:#fff;border:3px solid var(--accent);cursor:pointer}
.seg{display:flex;background:rgba(255,255,255,.06);border-radius:9px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;padding:6px 4px;border-radius:7px;cursor:pointer;color:var(--muted);font-size:12px;font-weight:550}
.seg button.on{background:rgba(255,255,255,.13);color:var(--text)}
.toggle{position:relative;width:34px;height:20px;flex:none}
.toggle input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}
.toggle span{position:absolute;inset:0;border-radius:20px;background:rgba(255,255,255,.16);transition:.2s}
.toggle span:after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.2s}
.toggle input:checked+span{background:var(--accent)}
.toggle input:checked+span:after{transform:translateX(14px)}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.06);padding:6px 10px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:550}
.btn:hover{background:rgba(255,255,255,.12)}
.btn.primary{background:var(--accent);border-color:transparent;color:#160b04}
.btn.primary:hover{filter:brightness(1.08)}

/* tree */
.grp{margin:2px 0}
.grp>.gh{display:flex;align-items:center;gap:8px;padding:6px 14px;cursor:pointer;user-select:none}
.grp>.gh:hover{background:rgba(255,255,255,.04)}
.grp>.gh .chev{width:10px;color:var(--muted);transition:transform .15s}
.grp.open>.gh .chev{transform:rotate(90deg)}
.grp>.gh .gname{flex:1;font-weight:600}
.grp>.gh .cnt{color:var(--muted);font-size:11px;font-family:var(--mono)}
.eye{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:2px;display:grid;place-items:center}
.eye svg{width:16px;height:16px}.eye.off{opacity:.35}
.grp ul{list-style:none;margin:0;padding:0 0 4px;display:none}
.grp.open ul{display:block}
.grp li{padding:4px 14px 4px 34px;cursor:pointer;display:flex;gap:8px;align-items:center;color:#c3ccd7}
.grp li:hover{background:rgba(255,255,255,.05)}
.grp li.sel{background:rgba(255,106,26,.16);color:#fff}
.dot{width:9px;height:9px;border-radius:3px;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.18) inset}
.tag{font-family:var(--mono);font-size:10px;padding:1px 5px;border-radius:5px;background:rgba(63,167,255,.16);color:#9fd0ff}

/* parts list */
.plist{list-style:none;margin:0;padding:0}
.plist li{display:flex;gap:10px;align-items:center;padding:7px 14px;cursor:pointer;border-left:3px solid transparent}
.plist li:hover{background:rgba(255,255,255,.04)}
.plist li.sel{background:rgba(255,106,26,.14);border-left-color:var(--accent)}
.plist .pid{font-family:var(--mono);font-size:11px;min-width:42px;color:var(--accent)}
.plist .pn{flex:1;line-height:1.25}
.plist .pn small{display:block;color:var(--muted);font-size:11px}
.plist .q{font-family:var(--mono);color:var(--muted);font-size:11px}
#psearch{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.25);outline:none}

/* info card */
#info{position:fixed;right:12px;top:70px;width:340px;max-height:calc(100% - 140px);overflow:auto;z-index:4;padding:14px 16px;display:none}
#info.show{display:block}
#info h2{margin:0 0 2px;font-size:15px;font-weight:650}
#info .sub{color:var(--muted);font-size:12px;margin-bottom:10px}
#info p{margin:6px 0;color:#cfd8e2}
#info table{width:100%;border-collapse:collapse;margin:8px 0;font-size:12px}
#info td{padding:4px 0;border-bottom:1px solid var(--line);vertical-align:top}
#info td:first-child{color:var(--muted);width:42%;padding-right:8px}
#info td:last-child{font-family:var(--mono);font-size:11.5px}
#info ul{margin:6px 0;padding-left:18px;color:#cfd8e2}#info li{margin:3px 0}
#info .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
#info .x{position:absolute;right:10px;top:10px;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:18px;line-height:1}

/* views */
#views{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;display:flex;gap:2px;padding:4px;z-index:4}
#views button{border:0;background:transparent;padding:7px 11px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:550;font-size:12px}
#views button:hover{background:rgba(255,255,255,.09);color:var(--text)}
#views .sep{width:1px;background:var(--line);margin:4px 3px}
#views button.on{color:var(--accent)}

/* loading */
#loading{position:fixed;inset:0;display:grid;place-items:center;z-index:20;background:radial-gradient(1200px 600px at 50% 40%,#1b2433,#0b0f15);transition:opacity .6s}
#loading.hide{opacity:0;pointer-events:none}
#loading .box{width:min(360px,80vw);text-align:center}
#loading h2{font-weight:650;font-size:17px;margin:0 0 4px}
#loading p{color:var(--muted);margin:0 0 18px}
#loading .bar{height:4px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden}
#loading .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff8a3d,#ff5a14);transition:width .2s}
#loading .err{color:#ff8b8b;margin-top:14px;font-size:12px}

#tip{position:fixed;pointer-events:none;z-index:6;padding:5px 9px;border-radius:7px;background:rgba(10,14,20,.88);border:1px solid var(--line);font-size:12px;display:none;white-space:nowrap}
#legend{position:fixed;right:12px;bottom:14px;z-index:3;padding:8px 12px;font-size:11.5px;color:var(--muted);display:flex;gap:12px;align-items:center}
#legend span{display:flex;align-items:center;gap:6px}
#handle{display:none}

/* narrow screens: bottom sheet */
@media (max-width:820px){
  #top{left:8px;right:8px;top:8px;gap:8px}
  #brand small,#hud{display:none}
  #brand{padding:7px 10px 7px 8px}
  #brand h1{font-size:13px}
  #side{left:8px;right:8px;width:auto;top:auto;bottom:8px;height:46vh;transition:transform .25s}
  #side.collapsed{transform:translateY(calc(100% - 44px))}
  #handle{display:flex;align-items:center;justify-content:center;gap:8px;height:44px;flex:none;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line)}
  #handle i{width:36px;height:4px;border-radius:4px;background:rgba(255,255,255,.25)}
  #info{left:8px;right:8px;width:auto;top:58px;max-height:40vh}
  #views{bottom:auto;top:58px;left:8px;right:8px;transform:none;overflow:auto}
  #views button{padding:6px 8px}
  #legend{display:none}
  #info.show ~ #views{display:none}
}
</style>

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}
</script>

<body>
<canvas id="c" tabindex="0"></canvas>

<div id="top">
  <div id="brand" class="glass">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#1a0b02" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13"/><path d="M12 4l6 10h-6"/><path d="M3 17h18l-3 4H6z"/></svg></div>
    <div><h1>Drone boat</h1><small id="sub">1.5 m autonomous wing-sail vessel · Rev F</small></div>
  </div>
  <div id="modes" class="glass">
    <button data-mode="assembly" class="on">Assembly</button>
    <button data-mode="parts">Printed parts</button>
  </div>
  <div class="spacer"></div>
  <div id="hud" class="glass">loading…</div>
</div>

<aside id="side" class="glass">
  <div id="handle"><i></i><span id="handleText">Controls</span></div>
  <div class="scroll" id="sideA">
    <div class="sec">
      <h3>Hull</h3>
      <div class="seg" id="hullMode">
        <button data-v="solid" class="on">Solid</button><button data-v="cut">Cut-away</button><button data-v="xray">X-ray</button>
      </div>
    </div>
    <div class="sec">
      <h3>Scene</h3>
      <div class="row"><label for="tWater">Sea surface</label><span class="toggle"><input type="checkbox" id="tWater" checked><span></span></span></div>
      <div class="row"><label for="tMotion">Sea motion</label><span class="toggle"><input type="checkbox" id="tMotion"><span></span></span></div>
      <div class="row"><label for="tPrinted">Highlight printed parts</label><span class="toggle"><input type="checkbox" id="tPrinted"><span></span></span></div>
      <div class="row"><label for="tSpin">Auto-rotate</label><span class="toggle"><input type="checkbox" id="tSpin"><span></span></span></div>
      <div class="row"><label for="tAO">Ambient occlusion</label><span class="toggle"><input type="checkbox" id="tAO"><span></span></span></div>
    </div>
    <div class="sec">
      <h3>Explode</h3>
      <div class="row"><label for="sExplode">Separation</label><input type="range" id="sExplode" min="0" max="1" step="0.001" value="0"><output id="oExplode">0%</output></div>
    </div>
    <div class="sec">
      <h3>Articulation</h3>
      <div class="row"><label for="sWing">Wing</label><input type="range" id="sWing" min="-90" max="90" step="0.5" value="0"><output id="oWing">0°</output></div>
      <div class="row"><label for="sTail">Tail</label><input type="range" id="sTail" min="-25" max="25" step="0.5" value="0"><output id="oTail">0°</output></div>
      <div class="row"><label for="sRudder">Rudders</label><input type="range" id="sRudder" min="-35" max="35" step="0.5" value="0"><output id="oRudder">0°</output></div>
      <div class="row"><label for="sVane">Wind vane</label><input type="range" id="sVane" min="-180" max="180" step="1" value="0"><output id="oVane">0°</output></div>
      <div class="row"><label for="tDemo">Animate sailing</label><span class="toggle"><input type="checkbox" id="tDemo"><span></span></span></div>
    </div>
    <div class="sec" style="border-bottom:0;padding-bottom:4px"><h3>Components</h3></div>
    <div id="tree"></div>
  </div>
  <div class="scroll" id="sideP" style="display:none">
    <div class="sec">
      <input id="psearch" placeholder="Filter parts…" autocomplete="off">
      <div class="row" style="margin-top:10px"><label for="tTurn">Turntable</label><span class="toggle"><input type="checkbox" id="tTurn" checked><span></span></span></div>
      <div class="row"><label for="tBed">Show print bed</label><span class="toggle"><input type="checkbox" id="tBed" checked><span></span></span></div>
      <div class="row"><label for="tLayers">Layer lines</label><span class="toggle"><input type="checkbox" id="tLayers" checked><span></span></span></div>
    </div>
    <ul class="plist" id="plist"></ul>
  </div>
</aside>

<div id="info" class="glass"></div>

<div id="views" class="glass">
  <button data-view="iso">3D</button><button data-view="side">Side</button><button data-view="top">Top</button><button data-view="front">Bow</button><button data-view="stern">Stern</button><button data-view="below">Below</button>
  <span class="sep"></span><button data-view="fit">Fit</button>
</div>

<div id="legend" class="glass"></div>
<div id="tip"></div>

<div id="loading"><div class="box"><h2>Drone boat · 3D model</h2><p id="ltext">Loading geometry…</p><div class="bar"><i id="lbar"></i></div><div class="err" id="lerr"></div></div></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const $ = s => document.querySelector(s);
const lbar = $('#lbar'), ltext = $('#ltext');
const fail = (msg) => { $('#lerr').textContent = msg; ltext.textContent = 'Could not start the viewer.'; };
window.addEventListener('error', e => fail(String(e.message || e)));

// Screen-space AO (GTAOPass) was tried and darkened the sky behind the transparent sea, so it stays off.
const GTAOPass = null;

// ------------------------------------------------------------------ load data
async function fetchText(url, total) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(url + ': HTTP ' + r.status);
  total = +r.headers.get('content-length') || total;
  if (!r.body || !r.body.getReader) { const t = await r.text(); lbar.style.width = '100%'; return t; }
  const rd = r.body.getReader(); const dec = new TextDecoder(); let s = '', got = 0;
  for (;;) { const { done, value } = await rd.read(); if (done) break; s += dec.decode(value, { stream: true }); got += value.length; lbar.style.width = Math.min(100, got / total * 100) + '%'; }
  return s + dec.decode();
}
let J, BUF;
try {
  J = JSON.parse(await fetchText('model.json', 7.0e6));
  const bin = atob(J.bin); const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  BUF = u8.buffer; delete J.bin;
} catch (e) { fail(e.message); throw e; }
ltext.textContent = 'Building scene…';
await new Promise(r => setTimeout(r, 30));

const DWL = J.dwl;
const S = 0.001;
const coarse = matchMedia('(pointer:coarse)').matches || Math.min(innerWidth, innerHeight) < 600;

// ------------------------------------------------------------------ renderer
const canvas = $('#c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, coarse ? 1.75 : 2));
renderer.setSize(innerWidth, innerHeight, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.localClippingEnabled = true;

const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

function gradientTex(stops) {
  const c = document.createElement('canvas'); c.width = 4; c.height = 512;
  const g = c.getContext('2d'); const gr = g.createLinearGradient(0, 0, 0, 512);
  stops.forEach(([o, col]) => gr.addColorStop(o, col)); g.fillStyle = gr; g.fillRect(0, 0, 4, 512);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const SKY_SEA = gradientTex([[0, '#4f7fb0'], [0.42, '#98bad8'], [0.6, '#cfdde8'], [1, '#cfdde8']]);
const SKY_STUDIO = gradientTex([[0, '#2a3340'], [0.55, '#59636f'], [1, '#7c8590']]);
const SKY_PARTS = gradientTex([[0, '#1d242e'], [0.6, '#3a434f'], [1, '#4b5460']]);

// ------------------------------------------------------------------ geometry
const GEO = {};
function geom(key) {
  if (GEO[key]) return GEO[key];
  const g = J.geoms[key]; const nv = g.nv;
  const q = new Int16Array(BUF, g.pos, nv * 3); const p = new Float32Array(nv * 3);
  const sc = g.sc, lo = g.lo;
  for (let i = 0; i < nv; i++) { const k = i * 3; p[k] = (q[k] + 32768) * sc[0] + lo[0]; p[k + 1] = (q[k + 1] + 32768) * sc[1] + lo[1]; p[k + 2] = (q[k + 2] + 32768) * sc[2] + lo[2]; }
  const bg = new THREE.BufferGeometry();
  bg.setAttribute('position', new THREE.BufferAttribute(p, 3));
  bg.setAttribute('normal', new THREE.BufferAttribute(new Int8Array(BUF, g.nrm, nv * 3), 3, true));
  bg.setIndex(new THREE.BufferAttribute(g.it === 16 ? new Uint16Array(BUF, g.idx, g.nf * 3) : new Uint32Array(BUF, g.idx, g.nf * 3), 1));
  bg.computeBoundingBox(); bg.computeBoundingSphere();
  return (GEO[key] = bg);
}

// ------------------------------------------------------------------ materials
const C = (h) => new THREE.Color(h);
const GLSL_COMMON = `
varying vec3 vLP;
float hash3(vec3 p){ p = fract(p*0.3183099+vec3(0.71,0.113,0.419)); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float deckZ(float x){ float s=clamp(x/1500.,0.,1.); float t=clamp(1.-s/0.4,0.,1.); return 230.+30.*t*t; }
`;
function patch(mat, frag, opts = {}) {
  mat.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, mat.userData.uniforms || {});
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vLP;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvLP = position;');
    let fs = sh.fragmentShader.replace('#include <common>', '#include <common>\n' + GLSL_COMMON + (opts.decl || ''));
    fs = fs.replace('#include <color_fragment>', '#include <color_fragment>\n' + (opts.pre || '') + '{\n' + frag + '\n}');
    if (opts.rough) fs = fs.replace('#include <roughnessmap_fragment>', '#include <roughnessmap_fragment>\n' + opts.rough);
    if (opts.light) fs = fs.replace('#include <lights_physical_fragment>', '#include <lights_physical_fragment>\n' + opts.light);
    sh.fragmentShader = fs;
  };
  mat.customProgramCacheKey = () => (opts.key || frag);
  return mat;
}
const U = (o) => Object.fromEntries(Object.entries(o).map(([k, v]) => [k, { value: v }]));

function hullMaterial() {
  const m = new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.3, clearcoat: 0.9, clearcoatRoughness: 0.08, envMapIntensity: 1.0 });
  m.userData.uniforms = U({ uDWL: DWL, uOrange: C('#ff5b12'), uAF: C('#5a1712'), uBoot: C('#f4f4f0'), uSheer: C('#0f2140'), uIn: C('#e9e6dc') });
  return patch(m, `
    float z = vLP.z; float dz = deckZ(vLP.x); float aa = max(fwidth(z), 0.15);
    float wl = uDWL + 14.0;
    float a1 = smoothstep(wl - aa, wl + aa, z);
    float a2 = smoothstep(wl + 13.0 - aa, wl + 13.0 + aa, z);
    vec3 col = mix(uAF, uBoot, a1); col = mix(col, uOrange, a2);
    float s1 = smoothstep(dz - 16.0 - aa, dz - 16.0 + aa, z) * (1.0 - smoothstep(dz - 7.0 - aa, dz - 7.0 + aa, z));
    col = mix(col, uSheer, s1 * step(30.0, vLP.x));
    hullAF = 1.0 - a1;
    float n = hash3(floor(vLP*1.3));

  partMesh = new THREE.Mesh(g, pmat(p)); partMesh.castShadow = partMesh.receiveShadow = true;
  // STL frame (mm, z up = print up) -> three (m, y up), centred on the bed
  const cx = (bb.min.x + bb.max.x) / 2, cy = (bb.min.y + bb.max.y) / 2;
  partMesh.matrixAutoUpdate = false;
  partMesh.matrix.set(S, 0, 0, -cx * S, 0, 0, S, -bb.min.z * S, 0, -S, 0, cy * S, 0, 0, 0, 1);
  partHolder.add(partMesh);
  const sz = bb.getSize(new THREE.Vector3());
  const bx = new THREE.Box3Helper(new THREE.Box3(new THREE.Vector3(-sz.x / 2 * S, 0, -sz.y / 2 * S), new THREE.Vector3(sz.x / 2 * S, sz.z * S, sz.y / 2 * S)), 0xff8a3d);
  bx.material.transparent = true; bx.material.opacity = 0.35; partBox = bx; partHolder.add(bx);
  const bs = (p.print.bed || '220').match(/\d+/); const bsz = Math.max(+(bs ? bs[0] : 220), sz.x + 20, sz.y + 20) * S;
  bed.scale.set(bsz, 1, bsz);
  const big = Math.max(sz.x, sz.y, sz.z) * S;
  const sc = keyP.shadow.camera; const e = Math.max(big, bsz) * 0.8; sc.left = -e; sc.right = e; sc.top = e; sc.bottom = -e; sc.updateProjectionMatrix();
  keyP.position.set(e * 3, e * 6, e * 4);
  turn.rotation.y = 0;
  fitPart(instant);
  document.querySelectorAll('#plist li').forEach(li => li.classList.toggle('sel', li.dataset.stem === p.stem));
  showPartInfo(p, sz);
  if (location.hash !== '#part-' + p.stem) history.replaceState(null, '', '#part-' + p.stem);
}
function fitPart(instant) {
  if (!partMesh) return;
  const b = new THREE.Box3().setFromObject(partMesh); const c = b.getCenter(new THREE.Vector3()); const r = Math.max(b.getSize(new THREE.Vector3()).length() * 0.5, 0.02);
  const vf = THREE.MathUtils.degToRad(camera.fov) / 2, hf = Math.atan(Math.tan(vf) * freeAspect());
  const dist = r / Math.sin(Math.min(vf, hf)) * 1.1;
  const dir = new THREE.Vector3(1, 0.75, 1.2).normalize();
  const p = c.clone().add(dir.multiplyScalar(dist));
  if (instant) { camera.position.copy(p); controls.target.copy(c); controls.update(); } else flyTo(p, c);
}

// ------------------------------------------------------------------ UI: tree
const EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const tree = $('#tree');
const GROUP_ORDER = ['Hull and deck', 'Keel and ballast', 'Wing-sail rig', 'Stern post', 'Deck fittings', 'Steering', 'Interior structure', 'Power and electronics'];
for (const gname of GROUP_ORDER.concat(Object.keys(groups).filter(g => !GROUP_ORDER.includes(g)))) {
  const its = groups[gname]; if (!its) continue;
  const d = document.createElement('div'); d.className = 'grp';
  d.innerHTML = `<div class="gh"><span class="chev">▸</span><span class="gname">${gname}</span><span class="cnt">${its.length}</span><button class="eye" title="Show or hide">${EYE}</button></div><ul></ul>`;
  const ul = d.querySelector('ul');
  for (const it of its) {
    const li = document.createElement('li'); li.dataset.id = it.id;
    li.innerHTML = `<i class="dot" style="background:${MATCOL[it.id]}"></i><span style="flex:1">${it.name}</span>${it.part ? `<span class="tag">${it.part}</span>` : ''}`;
    li.onclick = () => { select(it, true); };
    ul.appendChild(li); it.li = li;
  }
  d.querySelector('.gh').onclick = (e) => { if (e.target.closest('.eye')) return; d.classList.toggle('open'); };
  const eye = d.querySelector('.eye');
  eye.onclick = () => { const off = !eye.classList.toggle('off'); for (const it of its) { it.visible = off; it.mesh.visible = off; } };
  tree.appendChild(d);
}

// ------------------------------------------------------------------ UI: parts list
const plist = $('#plist');
for (const p of J.parts) {
  const li = document.createElement('li'); li.dataset.stem = p.stem;
  const placed = ITEMS.some(i => i.part === p.pid);
  li.innerHTML = `<span class="pid">${p.stem.split('_')[0]}</span><span class="pn">${p.name}<small>${p.print.material || ''} · ${p.print.size || ''} mm</small></span><span class="q">${+p.qty === 0 ? 'alt' : '×' + (p.qty || 1)}</span>`;
  li.onclick = () => { showPart(p); if (innerWidth < 820) side.classList.add('collapsed'); };
  plist.appendChild(li);
}
$('#psearch').oninput = (e) => { const q = e.target.value.toLowerCase(); plist.querySelectorAll('li').forEach(li => { li.style.display = li.textContent.toLowerCase().includes(q) ? '' : 'none'; }); };

// ------------------------------------------------------------------ info panel
const info = $('#info');
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const REPO = 'https://github.com/sheltonr2/drone-boat/blob/main/build-files/';
const _io = new MutationObserver(() => resize()); _io.observe(info, { attributes: true, attributeFilter: ['class'] });
function showItemInfo(it) {
  const p = it.part ? J.parts.find(x => x.pid === it.part && x.stem.startsWith(it.id.split('_')[0])) || J.parts.find(x => x.pid === it.part) : null;
  info.innerHTML = `<button class="x" aria-label="Close">×</button>
    <h2>${esc(it.name)}</h2><div class="sub">${esc(it.group)}</div>
    ${it.info ? `<p>${esc(it.info)}</p>` : ''}
    <table>${it.ref ? `<tr><td>Drawings</td><td>${esc(it.ref)}</td></tr>` : ''}${p ? `<tr><td>Print</td><td>${esc(p.print.material)} · ${esc(p.print.walls)} walls · ${esc(p.print.infill)}</td></tr><tr><td>Size</td><td>${esc(p.print.size)} mm</td></tr>` : ''}</table>
    <div class="actions">${p ? `<button class="btn primary" id="openPart">Open ${esc(p.stem.split('_')[0])} in parts view</button>` : ''}<button class="btn" id="focusBtn">Focus</button><button class="btn" id="isoBtn">Isolate</button></div>`;
  info.classList.add('show');
  info.querySelector('.x').onclick = () => select(null);
  if (p) info.querySelector('#openPart').onclick = () => { setMode('parts'); showPart(p); };
  info.querySelector('#focusBtn').onclick = () => focusObj(it.mesh);
  const ib = info.querySelector('#isoBtn');
  ib.onclick = () => { isolated = isolated === it ? null : it; ib.textContent = isolated ? 'Show all' : 'Isolate'; for (const o of ITEMS) o.mesh.visible = isolated ? o === it : o.visible !== false; };
}
let isolated = null;
function showPartInfo(p, sz) {
  const placed = ITEMS.filter(i => i.part === p.pid);
  const dims = Object.entries(p.dims || {}).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('');
  info.innerHTML = `<button class="x" aria-label="Close">×</button>
    <h2>${esc(p.stem.split('_')[0])} · ${esc(p.name)}</h2>
    <div class="sub">${+p.qty === 0 ? 'Alternative split version (print instead of the one-piece part)' : 'Quantity ' + esc(p.qty || '1')} · ${esc(p.stem)}.stl</div>
    <table>
      <tr><td>Material</td><td>${esc(p.print.material)}</td></tr>
      <tr><td>Walls / infill</td><td>${esc(p.print.walls)} / ${esc(p.print.infill)}</td></tr>
      <tr><td>Orientation</td><td>${esc(p.print.orientation)}</td></tr>
      <tr><td>Supports</td><td>${esc(p.print.supports)}</td></tr>
      <tr><td>Size</td><td>${sz.x.toFixed(0)} × ${sz.y.toFixed(0)} × ${sz.z.toFixed(0)} mm</td></tr>
      <tr><td>Minimum bed</td><td>${esc(p.print.bed)}</td></tr>
      <tr><td>Filament / time</td><td>${esc(p.print.grams)} g · ${esc(p.print.hours)} h each</td></tr>
      ${dims}
    </table>
    ${(p.notes || []).length ? `<ul>${p.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul>` : ''}
    <div class="actions">${placed.length ? `<button class="btn primary" id="inAsm">Show in assembly</button>` : ''}<a class="btn" href="${REPO}stl/${encodeURIComponent(p.stem)}.stl" target="_blank" rel="noopener">STL on GitHub</a></div>`;
  info.classList.add('show');
  info.querySelector('.x').onclick = () => info.classList.remove('show');
  if (placed.length) info.querySelector('#inAsm').onclick = () => { setMode('assembly'); const it = placed.find(i => p.stem.startsWith(i.id.split('_')[0])) || placed[0]; select(it, true); };
}

// ------------------------------------------------------------------ selection + picking
const hlMesh = new THREE.Mesh(new THREE.BufferGeometry(), hlMat); hlMesh.renderOrder = 3; hlMesh.userData.noAO = true; hlMesh.raycast = () => {};
let sel = null;
function select(it, focus) {
  if (sel && sel.li) sel.li.classList.remove('sel');
  if (hlMesh.parent) hlMesh.parent.remove(hlMesh);
  sel = it;
  if (!it) { info.classList.remove('show'); return; }
  hlMesh.geometry = it.mesh.geometry; it.mesh.add(hlMesh);
  if (it.li) { it.li.classList.add('sel'); const g = it.li.closest('.grp'); g.classList.add('open'); it.li.scrollIntoView({ block: 'nearest' }); }
  showItemInfo(it);
  if (it.interior && st.hull === 'solid' && !st.printed) setHull('cut');
  if (focus) focusObj(it.mesh);
}
const ray = new THREE.Raycaster(); const ptr = new THREE.Vector2();
let down = null;
function pick(ev) {
  const r = canvas.getBoundingClientRect(); ptr.set((ev.clientX - r.left) / r.width * 2 - 1, -(ev.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const objs = ITEMS.filter(i => i.mesh.visible && !(i.mesh.material.transparent && (SHELL.has(i.id) || st.printed))).map(i => i.mesh);
  const hits = ray.intersectObjects(objs, false).filter(h => !(st.hull === 'cut' && h.point.z > 0.002 && h.object.material.clippingPlanes));
  return hits.length ? hits[0].object.userData.item : null;
}
canvas.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
canvas.addEventListener('pointerup', e => {
  if (!down) return; const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y); down = null;
  if (moved > 5 || mode !== 'assembly') return;
  const it = pick(e); select(it, false);
});
canvas.addEventListener('dblclick', e => { if (mode !== 'assembly') return; const it = pick(e); if (it) { select(it, true); } });
const tip = $('#tip'); let tipT = 0;
canvas.addEventListener('pointermove', e => {
  if (mode !== 'assembly' || e.pointerType === 'touch' || e.buttons) { tip.style.display = 'none'; return; }
  const now = performance.now(); if (now - tipT < 60) return; tipT = now;
  const it = pick(e);
  if (it) { tip.textContent = it.name; tip.style.display = 'block'; tip.style.left = (e.clientX + 14) + 'px'; tip.style.top = (e.clientY + 12) + 'px'; canvas.style.cursor = 'pointer'; }
  else { tip.style.display = 'none'; canvas.style.cursor = ''; }
});
canvas.addEventListener('pointerleave', () => tip.style.display = 'none');

// ------------------------------------------------------------------ controls wiring
const side = $('#side');
$('#handle').onclick = () => side.classList.toggle('collapsed');
if (innerWidth < 820) side.classList.add('collapsed');
function bindRange(id, key, fmt) {
  const el = $('#' + id), out = $('#o' + id.slice(1));
  el.oninput = () => { st[key] = +el.value; out.textContent = fmt(+el.value); if (key !== 'explode') { st.demo = false; $('#tDemo').checked = false; } updateMatrices(); };
}
bindRange('sExplode', 'explode', v => Math.round(v * 100) + '%');
bindRange('sWing', 'wing', v => v.toFixed(0) + '°');
bindRange('sTail', 'tail', v => v.toFixed(0) + '°');
bindRange('sRudder', 'rudder', v => v.toFixed(0) + '°');
bindRange('sVane', 'vane', v => v.toFixed(0) + '°');
function setHull(v) { st.hull = v; document.querySelectorAll('#hullMode button').forEach(b => b.classList.toggle('on', b.dataset.v === v)); applyLooks(); setWater(st.water); }
document.querySelectorAll('#hullMode button').forEach(b => b.onclick = () => setHull(b.dataset.v));
function setWater(on) {
  st.water = on; on = on && st.hull === 'solid' && !st.printed; water.visible = on; ground.visible = !on; grid.visible = !on;
  sceneA.background = on ? SKY_SEA : SKY_STUDIO;
  sceneA.fog = on ? new THREE.Fog('#cfdde8', 8, 34) : null;
  renderer.toneMappingExposure = on ? 1.0 : 1.05;
}
$('#tWater').onchange = e => setWater(e.target.checked);
$('#tMotion').onchange = e => { st.motion = e.target.checked; if (!st.motion) { boat.position.set(0, 0, 0); boat.rotation.set(0, 0, 0); } };
$('#tPrinted').onchange = e => { st.printed = e.target.checked; applyLooks(); setWater(st.water); };
$('#tSpin').onchange = e => controls.autoRotate = e.target.checked;
$('#tAO').onchange = e => { if (gtao) gtao.enabled = e.target.checked; };
$('#tDemo').onchange = e => { st.demo = e.target.checked; };
$('#tTurn').onchange = e => { if (!e.target.checked) turn.rotation.y = 0; };
$('#tBed').onchange = e => { bed.visible = e.target.checked; };
$('#tLayers').onchange = e => { for (const k of ['asa', 'petg', 'pla']) MAT[k].userData.uniforms.uOn.value = e.target.checked ? 1 : 0; };
document.querySelectorAll('#views button').forEach(b => b.onclick = () => view(b.dataset.view));

// ------------------------------------------------------------------ modes + routing
let mode = 'assembly';
function setMode(m, fromHash) {
  if (m === mode && !fromHash) return;
  mode = m;
  document.querySelectorAll('#modes button').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  $('#sideA').style.display = m === 'assembly' ? '' : 'none';
  $('#sideP').style.display = m === 'parts' ? '' : 'none';
  $('#handleText').textContent = m === 'assembly' ? 'Controls & components' : 'Printed parts';
  document.querySelectorAll('#views button').forEach(b => b.style.display = (m === 'parts' && !['fit'].includes(b.dataset.view)) ? 'none' : '');
  $('#views .sep').style.display = m === 'parts' ? 'none' : '';
  $('#legend').style.display = m === 'assembly' && innerWidth >= 820 ? '' : 'none';
  renderPass.scene = m === 'assembly' ? sceneA : sceneP;
  if (gtao) gtao.scene = renderPass.scene;
  tip.style.display = 'none';
  if (m === 'assembly') {
    controls.minDistance = 0.08; controls.maxDistance = 9;
    if (sel) showItemInfo(sel); else info.classList.remove('show');
    view('iso', true);
    if (!fromHash && location.hash !== '#assembly') history.replaceState(null, '', '#assembly');
  } else {
    controls.minDistance = 0.02; controls.maxDistance = 3;
    if (!curPart) showPart(J.parts.find(p => p.pid === 'P07') || J.parts[0], true); else { showPart(curPart, true); }
  }
  hud();
}
document.querySelectorAll('#modes button').forEach(b => b.onclick = () => setMode(b.dataset.mode));
function route() {
  const h = location.hash.slice(1);
  if (h.startsWith('part-')) { const p = J.parts.find(x => x.stem === h.slice(5)) || J.parts.find(x => x.pid === h.slice(5)); if (p) { if (mode !== 'parts') setMode('parts', true); showPart(p, true); return; } }
  if (h === 'parts') { setMode('parts', true); return; }
  setMode('assembly', true);
}
addEventListener('hashchange', route);
function hud() {
  const tris = Object.values(J.geoms).reduce((a, g) => a + g.nf, 0);
  $('#hud').textContent = mode === 'assembly' ? `${ITEMS.length} components · ${(tris / 1000).toFixed(0)}k triangles · ${J.mass} kg` : `${J.parts.length} STL files · click a part`;
}
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'Escape') select(null);
  if (e.key === 'f' && sel) focusObj(sel.mesh);
  if (e.key === 'e') { const el = $('#sExplode'); el.value = st.explode > 0.5 ? 0 : 1; animExplode(+el.value); }
  if (e.key === 'x') setHull(st.hull === 'xray' ? 'solid' : 'xray');
  if (e.key === 'c') setHull(st.hull === 'cut' ? 'solid' : 'cut');
});
let exAnim = null;
function animExplode(to) { exAnim = { from: st.explode, to, s: performance.now() }; }

// ------------------------------------------------------------------ resize + loop
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); composer.setSize(w, h); camera.aspect = w / h;
  const shift = w >= 820 ? (side.getBoundingClientRect().right - (info.classList.contains('show') ? info.getBoundingClientRect().width + 12 : 0)) / 2 : 0;
  if (shift) camera.setViewOffset(w, h, -shift, 0, w, h); else camera.clearViewOffset();
  camera.updateProjectionMatrix();
  if (gtao) gtao.setSize(w * renderer.getPixelRatio(), h * renderer.getPixelRatio());
}
addEventListener('resize', resize);

updateMatrices(); applyLooks(); setWater(true);
camera.position.set(3, 1.5, 3);
resize();
route();

const clock = new THREE.Clock();
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  if (fly) {
    const k = Math.min((performance.now() - fly.s) / fly.d, 1), e = ease(k);
    camera.position.lerpVectors(fly.p0, fly.p1, e); controls.target.lerpVectors(fly.t0, fly.t1, e);
    if (k >= 1) fly = null;
  }
  if (exAnim) {
    const k = Math.min((performance.now() - exAnim.s) / 900, 1); st.explode = exAnim.from + (exAnim.to - exAnim.from) * k;
    $('#oExplode').textContent = Math.round(st.explode * 100) + '%'; updateMatrices(); if (k >= 1) exAnim = null;
  }
  if (mode === 'assembly') {
    if (st.water) { wN.offset.x = t * 0.004; wN.offset.y = t * 0.0025; }
    if (st.demo) {
      st.wing = 24 * Math.sin(t * 0.35); st.tail = -12 * Math.sin(t * 0.35 + 0.4); st.rudder = 18 * Math.sin(t * 0.5); st.vane = st.wing + 25 + 6 * Math.sin(t * 1.3);
      for (const [k, id, f] of [['wing', 'sWing', v => v.toFixed(0) + '°'], ['tail', 'sTail', v => v.toFixed(0) + '°'], ['rudder', 'sRudder', v => v.toFixed(0) + '°'], ['vane', 'sVane', v => v.toFixed(0) + '°']]) { $('#' + id).value = st[k]; $('#o' + id.slice(1)).textContent = f(st[k]); }
      updateMatrices();
    }
    if (st.motion) {
      boat.position.y = 0.012 * Math.sin(t * 1.1) + 0.006 * Math.sin(t * 1.9 + 1);
      boat.rotation.x = 0.05 * Math.sin(t * 0.8) + 0.02 * Math.sin(t * 1.7);
      boat.rotation.z = 0.025 * Math.sin(t * 0.6 + 0.5);
    }
  } else if ($('#tTurn').checked && !down) turn.rotation.y += dt * 0.35;
  controls.update();
  composer.render();
}
loop();
$('#loading').classList.add('hide');
setTimeout(() => $('#loading').remove(), 800);
</script>
