; Companion comms firmware: Adafruit Feather ESP32-S3 (the 2 MB PSRAM version) in the main box, with the
; RockBLOCK Plus 9704 on RS-232 (MAX3232) and the camera on a second UART behind its own 5 V load switch.
; Build and upload:  pio run -t upload   (from this folder; needs PlatformIO and internet for the libraries)
; Not yet built on hardware (written 28 Nov 2026). See README.md for the bench test and the open points.
[env:feather_esp32s3]
platform = espressif32
board = adafruit_feather_esp32s3
framework = arduino
board_build.arduino.memory_type = qio_qspi
build_flags = -DBOARD_HAS_PSRAM -DCORE_DEBUG_LEVEL=1 -DIMT_PAYLOAD_SIZE=12000
lib_deps = https://github.com/rock7/RockBLOCK-9704.git
lib_extra_dirs = ../lib
monitor_speed = 115200
