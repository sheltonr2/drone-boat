; Camera firmware: Seeed Studio XIAO ESP32S3 Sense (OV3660 or OV2640, microSD) in the stern-post pod (P29).
; Build and upload:  pio run -t upload   (from this folder; needs PlatformIO)
; Not yet built on hardware (written 28 Nov 2026). See README.md for the bench test.
[env:xiao_esp32s3_sense]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
board_build.arduino.memory_type = qio_opi
build_flags = -DBOARD_HAS_PSRAM -DCORE_DEBUG_LEVEL=1
lib_extra_dirs = ../lib
monitor_speed = 115200
